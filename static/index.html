  // Reasons the match step parks for a PO-number problem specifically - a
  // human-corrected number is enough to retry all three without re-uploading
  // the invoice (see invoice_tools.retry_match_with_corrected_po).
  var RETRYABLE_REVIEW_REASONS = ["po_not_found", "po_line_not_found", "ambiguous_po_line"];

  function renderReview(review) {
    if (!review) return "";
    var body = '<div class="kv-grid">' +
      kv("Review id", review.id) + kv("Reason", review.reason) +
      (review.attempted_po_number ? kv("Attempted PO number", review.attempted_po_number) : "") +
      "</div>" +
      (review.detail ? '<div class="kv-full"><span class="k">Detail</span><span class="v">' +
        esc(review.detail) + "</span></div>" : "");
    if (RETRYABLE_REVIEW_REASONS.indexOf(review.reason) !== -1 && review.status !== "resolved") {
      body += '<div class="field-form-actions">' +
        '<input class="field-input" style="flex:1 1 160px" type="text" id="reviewPoInput" ' +
          'placeholder="Corrected PO number" value="' + esc(review.attempted_po_number || "") + '">' +
        '<button class="apply-edits-btn" id="retryMatchBtn" data-rid="' + esc(review.id) + '">Retry match</button>' +
        '<span class="apply-edits-note" id="retryMatchNote">Fix the PO number and retry - no need to re-upload the invoice.</span>' +
      "</div>";
    }
    return invCard("Human review queue", body);
  }

  function wireReviewRetry() {
    var btn = $("retryMatchBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var reviewId = btn.getAttribute("data-rid");
      var input = $("reviewPoInput");
      var note = $("retryMatchNote");
      var corrected = input ? input.value.trim() : "";
      if (!corrected) {
        if (note) note.textContent = "Enter a PO number first.";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Retrying…";
      fetch("/api/invoice/review/" + encodeURIComponent(reviewId) + "/retry", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ corrected_po_number: corrected }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            showToast("Retried with the corrected PO number - showing the new result.");
            drawerScaffold("");
            renderOutcome(d);
            if (d.run_id) {
              fetch("/api/invoice/trace/" + encodeURIComponent(d.run_id) + "?after=-1")
                .then(function (r) { return r.json(); })
                .then(function (td) { if (td.events && td.events.length) appendTraceSteps(td.events, false); })
                .catch(function () {});
            }
          } else {
            btn.disabled = false;
            btn.textContent = "Retry match";
            if (note) note.textContent = d.error || "Retry failed - try a different PO number.";
            showToast(d.error || "Retry failed.");
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = "Retry match";
          if (note) note.textContent = "Network error retrying the match.";
        });
    });
  }

  function renderDuplicate(dup) {
    var ex = (dup && dup.existing) || {};
    if (!Object.keys(ex).length) return "";
    var cells = Object.keys(ex).filter(function (k) {
      return typeof ex[k] !== "object";
    }).map(function (k) { return kv(k.replace(/_/g, " "), ex[k]); }).join("");
    return invCard("Existing document (" + esc(dup.source || "ledger") + ")", '<div class="kv-grid">' + cells + "</div>");
  }

  // Tier-1 blockers. Each is rendered as its own reason + remedy rather than
  // being collapsed into one line: the whole point of the pre-flight tier is
  // that a person is told exactly what is wrong and who fixes it.
  function renderBlockers(proposal) {
    var list = (proposal && proposal.blockers) || [];
    if (!list.length) return "";
    var rows = list.map(function (b) {
      return '<div class="inv-warn"><strong>' + esc(b.message) + "</strong><br>" +
        esc(b.remedy) + "</div>";
    }).join("");
    return invCard("Why this cannot be posted yet",
      '<div class="inv-warn-list">' + rows + "</div>" +
      '<div class="kv-grid" style="margin-top:14px">' + kv("SAP called", "No - stopped locally") + "</div>");
  }

  // STEP 2's entry point, offered only on a clean match. A finished match is a
  // complete answer on its own - someone asking "does this match?" is not
  // asking "will SAP accept a posting?", and those are different questions with
  // different failure reasons. So the pre-flight checks (and any master-data
  // blockers they raise) run when this is clicked, not before. The click sends
  // only the match_id: the figures stay the ones the server computed.
  function renderPostStep(res) {
    if (!res.match_id) return "";
    return invCard("Post this invoice to SAP",
      '<div class="approve-row">' +
        '<button class="approve-btn" id="postStepBtn" data-mid="' + esc(res.match_id) + '">Continue to posting</button>' +
        '<span class="approve-note" id="postStepNote">Optional - the match above is already complete. ' +
        "This runs SAP's posting pre-flight checks and builds a proposal; it still posts nothing, " +
        "you approve that separately.</span>" +
      "</div>");
  }

  function renderOutcome(res) {
    var spec = OUTCOME_TEXT[res.outcome] || (res.ok ? ["warn", "Run finished."] : ["bad", res.error || "Run failed."]);
    var html = '<div class="inv-outcome ' + spec[0] + '">' + esc(spec[1]) + "</div>";
    if (res.error && !OUTCOME_TEXT[res.outcome]) html = '<div class="inv-outcome bad">' + esc(res.error) + "</div>";
    html += renderExtracted(res.extracted);
    if (res.duplicate) html += renderDuplicate(res.duplicate);
    html += renderComputed(res.match) + renderVariances(res.match) + renderCandidates(res.match);
    if (res.outcome === "blocked") html += renderBlockers(res.proposal);
    html += renderReview(res.review);
    if (res.outcome === "matched") html += renderPostStep(res);
    if (res.outcome === "proposed" || res.outcome === "proposal_failed") html += renderProposal(res.proposal);
    html += renderEmail(res.email);
    var host = $("invOutcome");
    if (!host) return;
    host.innerHTML = html;
    wireApprove();
    wireApplyEdits();
    wireReviewRetry();
    wirePostStep();
  }

  function wirePostStep() {
    var btn = $("postStepBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var matchId = btn.getAttribute("data-mid");
      var note = $("postStepNote");
      btn.disabled = true;
      btn.textContent = "Running pre-flight…";
      fetch("/api/invoice/propose/" + encodeURIComponent(matchId), { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) {
            btn.disabled = false;
            btn.textContent = "Continue to posting";
            if (note) note.textContent = d.error || "Could not start the posting step.";
            showToast(d.error || "Could not start the posting step.");
            return;
          }
          // Fold the posting result onto the stored panel so the card reopens on
          // it rather than back on the match. Session-only: after a reload the
          // panel reverts to the match, which is honest - the proposal has its
          // own server-side TTL and does not outlive the process either.
          var base = (openPanelKey && panelStore[openPanelKey]) || {};
          var merged = {};
          Object.keys(base).forEach(function (k) { merged[k] = base[k]; });
          Object.keys(d).forEach(function (k) { merged[k] = d[k]; });
          if (openPanelKey) panelStore[openPanelKey] = merged;
          renderOutcome(merged);
          drawerBody.scrollTop = 0;
          // The pre-flight/propose steps appended to the same run's trace.
          if (d.run_id) replayTrace(d.run_id);
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = "Continue to posting";
          if (note) note.textContent = "Network error starting the posting step.";
        });
    });
  }

  function collectFieldEdits() {
    var edits = {};
    document.querySelectorAll("#invProposalCard [data-field-key]").forEach(function (el) {
      edits[el.getAttribute("data-field-key")] = el.value;
    });
    return edits;
  }

  function wireApplyEdits() {
    var btn = $("applyEditsBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var pid = btn.getAttribute("data-pid");
      var edits = collectFieldEdits();
      btn.disabled = true;
      btn.textContent = "Applying…";
      fetch("/api/invoice/proposal/" + encodeURIComponent(pid) + "/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ edits: edits }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            var card = $("invProposalCard");
            if (card) card.innerHTML = proposalCardInner(d);
            wireApprove();
            wireApplyEdits();
            if (d.rejected_fields && d.rejected_fields.length) {
              showToast("That field is locked (from the matched PO) and can't be edited: " +
                d.rejected_fields.join(", "));
            } else {
              showToast("Changes applied - review, then approve.");
            }
          } else {
            btn.disabled = false;
            btn.textContent = "Apply edits";
            showToast(d.error || "Could not apply the edits.");
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = "Apply edits";
          showToast("Network error applying edits.");
        });
    });
  }

  function wireApprove() {
    var btn = $("approveBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var pid = btn.getAttribute("data-pid");
      btn.disabled = true;
      btn.textContent = "Posting…";
      fetch("/api/invoice/commit/" + encodeURIComponent(pid), { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var note = $("approveNote");
          if (d.ok) {
            btn.textContent = d.duplicate_suppressed ? "Already posted" : "Posted ✓";
            note.textContent = d.message || ("Supplier invoice " + d.supplier_invoice + "/" + d.fiscal_year + " posted.");
            showToast(d.message || "Supplier invoice posted.");
          } else {
            btn.disabled = false;
            btn.textContent = "Approve & post to SAP";
            // Tier 2: `explanation` is the plain-language reading of SAP's
            // rejection (deterministic where we know the message, otherwise a
            // single bounded LLM translation). SAP's own wording is kept below
            // it rather than replaced - the clerk needs the plain version, but
            // whoever escalates to Basis/Finance needs the original text.
            var plain = d.explanation || d.error || "The post was rejected.";
            note.textContent = plain;
            if (d.explanation && d.error && d.explanation !== d.error) {
              note.textContent = plain + "  (SAP said: " + d.error + ")";
            }
            showToast(plain);
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = "Approve & post to SAP";
          showToast("Network error posting the invoice.");
        });
    });
  }

  // Poll forward from the last seq we rendered, so a step never re-renders and
  // none is missed - exactly the contract invoice_trace.events_after provides.
  // The run_id is minted client-side and sent with the turn, so this can stream
  // the agent's steps WHILE the chat request is still in flight; an unknown id
  // just answers ok:false until the pipeline's first emit creates the run.
  function pollTrace(runId) {
    fetch("/api/invoice/trace/" + encodeURIComponent(runId) + "?after=" + seenSeq)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) return;
        if (d.events && d.events.length) {
          if (seenSeq < 0) $("traceList").innerHTML = "";  // drop the placeholder
          appendTraceSteps(d.events, true);
          seenSeq = d.next_seq;
        }
        if (d.done) stopTracePoll();
      })
      .catch(function () {});
  }

  function stopTracePoll() {
    if (tracePoll) { clearInterval(tracePoll); tracePoll = null; }
  }

  // Re-render a finished run's whole trace from the server. Used when replaying
  // a stored panel and after the posting step appends its own steps to the same
  // run - fetching all of it and replacing the list is idempotent, so neither
  // caller has to track how many steps it has already drawn.
  function replayTrace(runId) {
    fetch("/api/invoice/trace/" + encodeURIComponent(runId) + "?after=-1")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var host = $("traceList");
        if (!host) return;
        if (d.ok && d.events && d.events.length) {
          host.innerHTML = "";
          appendTraceSteps(d.events, false);
          drawerBody.scrollTop = 0;
        } else {
          host.innerHTML = '<div class="trace-meta">The step-by-step trace for this run has ' +
            "expired from the server's in-flight store. The result below is unchanged.</div>";
        }
      })
      .catch(function () {});
  }

  function newRunId() {
    return "r" + Date.now().toString(16) + Math.random().toString(16).slice(2, 8);
  }

  /* drawer open/close. Opening narrows the chat and collapses the left sidebar,
     the way opening a file does in Claude - the chat is still readable, just
     smaller, so the conversation and the result stay side by side. */
  var sideWasCollapsed = false;

  function openDrawer(title) {
    if (!appEl.classList.contains("drawer-open")) {
      sideWasCollapsed = appEl.classList.contains("side-collapsed");
      appEl.classList.add("side-collapsed", "drawer-open");
    }
    drawerTitle.textContent = title || "Result";
  }

  function closeDrawer() {
    appEl.classList.remove("drawer-open");
    // Restore the sidebar only if the user had it open before we hid it.
    if (!sideWasCollapsed) appEl.classList.remove("side-collapsed");
    openPanelKey = "";
    stopTracePoll();
    Array.prototype.forEach.call(document.querySelectorAll(".result-card.active"), function (c) {
      c.classList.remove("active");
    });
  }

  $("drawerClose").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && appEl.classList.contains("drawer-open")) closeDrawer();
  });

  /* the drawer's shell: a live trace card + an outcome region the run fills in */
  function drawerScaffold(label) {
    drawerBody.innerHTML =
      invCard("Agent trace" + (label ? " · " + esc(label) : ""), '<div id="traceList"></div>') +
      '<div id="invOutcome"></div>';
  }

  // Called as soon as a turn with an attachment is sent: open the drawer and
  // start streaming steps, before the model has even decided what to call. If
  // no run ever starts (not an invoice request, or the model skipped the tool
  // call), the delivered response still carries a "not_run" panel - see the
  // `deliver()` handling in send() - so the drawer swaps to that instead of
  // just vanishing with no trace and no way to reopen it.
  function beginInvoiceRun(runId, label) {
    seenSeq = -1;
    stopTracePoll();
    openDrawer("Invoice run");
    drawerScaffold(label);
    $("traceList").innerHTML = '<div class="trace-step"><span class="trace-dot running"></span>' +
      '<div class="trace-body"><div class="trace-label">Waiting for the agent…</div></div></div>';
    var first = true;
    tracePoll = setInterval(function () {
      if (first) { first = false; }
      pollTrace(runId);
    }, 600);
    pollTrace(runId);
  }

  // Replay a stored panel (card clicked, possibly turns later or after reload).
  function openPanel(key) {
    var panel = panelStore[key];
    if (!panel) { showToast("That result is no longer in this session."); return; }
    openPanelKey = key;
    seenSeq = -1;
    stopTracePoll();
    openDrawer(panel.filename ? "Invoice · " + panel.filename : "Invoice run");
    drawerScaffold(panel.filename || "");
    renderOutcome(panel);
    drawerBody.scrollTop = 0;
    // The trace lives in the server's capped in-memory store; replay it if the
    // run is still retained, otherwise the outcome above stands on its own.
    // A "not_run" panel has no trace at all (the pipeline never started), so
    // don't bother fetching one just to show a misleading "expired" note.
    if (panel.run_id && panel.outcome !== "not_run") replayTrace(panel.run_id);
    Array.prototype.forEach.call(document.querySelectorAll(".result-card"), function (c) {
      c.classList.toggle("active", c.getAttribute("data-panel-key") === key);
    });
  }

  // The in-chat card. Title/subtitle describe the outcome; every figure stays in
  // the panel, so the card can never misstate one.
  var CARD_TEXT = {
    matched: ["good", "Clean 3-way match", "Nothing posted - post it from the panel if you want to"],
    proposed: ["good", "Ready to post", "Posting proposal ready for approval"],
    variance: ["warn", "Variance found", "Nothing posted. See the variance detail"],
    duplicate: ["warn", "Duplicate invoice", "Stopped; the existing document is shown"],
    needs_review: ["warn", "Sent to human review", "A field was read with low confidence"],
    po_line_not_found: ["warn", "PO line not found", "Candidate lines listed for a human"],
    ambiguous_po_line: ["warn", "PO line ambiguous", "Candidate lines listed for a human"],
    po_not_found: ["warn", "PO number not found", "Correct the PO number to retry the match"],
    extraction_failed: ["bad", "Could not read the invoice", "Extraction failed"],
    match_failed: ["bad", "Could not complete the match", "See the reason in the panel"],
    proposal_failed: ["bad", "Matched, proposal failed", "The payload could not be built"],
    blocked: ["warn", "Blocked before posting", "Pre-flight checks failed; SAP was not called"],
    not_run: ["warn", "Attachment not processed", "No invoice check ran for this file"]
  };

  function renderResultCard(key, panel) {
    var t = CARD_TEXT[panel.outcome] || ["warn", "Invoice run finished", "Open for the detail"];
    var glyph = t[0] === "good"
      ? '<path d="m5 13 4 4L19 7"/>'
      : t[0] === "bad" ? '<path d="M18 6 6 18M6 6l12 12"/>' : '<path d="M12 9v4m0 4h.01"/>';
    return '<button class="result-card" data-panel-key="' + esc(key) + '">' +
      '<span class="rc-icon ' + t[0] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' + glyph + "</svg></span>" +
      '<span class="rc-text"><span class="rc-title">' + esc(t[1]) + "</span>" +
      '<span class="rc-sub">' + esc(t[2]) +
      (panel.filename ? " · " + esc(panel.filename) : "") + "</span></span>" +
      '<span class="rc-open">Click to show result →</span></button>';
  }

  function wireResultCards(scope) {
    Array.prototype.forEach.call((scope || document).querySelectorAll(".result-card"), function (card) {
      if (card.dataset.wired) return;
      card.dataset.wired = "1";
      card.addEventListener("click", function () {
        var key = card.getAttribute("data-panel-key");
        if (openPanelKey === key && appEl.classList.contains("drawer-open")) closeDrawer();
        else openPanel(key);
      });
    });
  }

  /* ---------- function mode (Knowledge Base / SAP MCP) ---------- */
  var fnButtons = { documents: $("fnDocs"), mcp: $("fnMcp") };

  function renderFnToggle() {
    Object.keys(fnButtons).forEach(function (m) {
      fnButtons[m].classList.toggle("active", m === currentMode);
    });
  }

  // Applies everything that depends on the active mode but not on which chat
  // is open: theme (body[data-mode] drives colours + KB-toggle visibility),
  // pill state, placeholder, chips, and the status panel.
  function applyMode() {
    document.body.dataset.mode = currentMode;
    renderFnToggle();
    input.placeholder = MODES[currentMode].placeholder;
    renderSuggestions();
    renderStatusPanel();
    if (currentMode === "mcp" && !lastTolerances) loadTolerances();
  }

  function setMode(mode) {
    if (mode === currentMode || !MODES[mode]) return;
    modeCurrentChatId[currentMode] = currentChatId;  // remember where we were
    currentMode = mode;
    try { localStorage.setItem("sapHelperMode", mode); } catch (e) {}
    // Attachments belong to the turn you were composing; leaving the mode that
    // can use them discards them rather than silently carrying them over.
    if (pending.length) { pending = []; renderAttachRow(); }
    closeDrawer();
    chats = loadChats(mode);
    currentChatId = modeCurrentChatId[mode];
    applyMode();
    // Restore this mode's open conversation, or fall back to a fresh composer.
    if (currentChatId && getChat(currentChatId)) openChat(currentChatId);
    else newChat();
  }

  Object.keys(fnButtons).forEach(function (m) {
    fnButtons[m].addEventListener("click", function () { setMode(m); });
  });

  applyMode();
  renderHistory();
  autoGrow();
  input.focus();
})();
</script>
</body>
</html>
