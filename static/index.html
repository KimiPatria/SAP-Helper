<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --r: 10px;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --font: 'Inter', system-ui, sans-serif;

    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e6e9ef;
    --border-strong: #d8dce5;
    --text: #17203a;
    --muted: #67718c;
    --faint: #8a93ab;
    --accent: #2e5bff;
    --accent-soft: #eef2ff;
    --accent-deep: #1f43cc;
    --accent2: #7c3aed;   /* gradient partner for logo/avatars/greeting */
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
  }

  /* SAP MCP mode: teal -> cyan, so the two interfaces read apart at a glance. */
  body[data-mode="mcp"] {
    --accent: #0d9488;
    --accent-soft: #ccfbf1;
    --accent-deep: #0f766e;
    --accent2: #06b6d4;
  }
  /* Colour swap is a deliberate theme change, not per-element motion. */
  body, .logo-mark, .avatar, .greeting, .provider-badge,
  .kb-opt.active, .pill-opt.active { transition: background .35s var(--ease), color .35s var(--ease); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- shell ---------- */
  .app { display: flex; flex-direction: column; height: 100%; }
  .body { display: flex; flex: 1; min-height: 0; }

  /* ---------- header ---------- */
  header {
    height: 52px; flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 30;
    animation: slideDown .5s var(--ease) both;
  }
  .logo { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; color: #fff;
  }
  .logo-mark svg { width: 14px; height: 14px; }
  .logo-name { font-size: 14px; font-weight: 800; letter-spacing: -.3px; }

  .menu-btn {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    transition: background .25s var(--ease), color .25s var(--ease), transform .2s var(--ease);
  }
  .menu-btn:hover { background: var(--bg); color: var(--text); }
  .menu-btn:active { transform: scale(.9); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* Fixed dead-centre regardless of sidebar/logo width or whether the
     Local/Bedrock KB sub-toggle is showing. */
  .fn-toggle-wrap {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  /* Too narrow for true centring without colliding with the logo/right
     side - drop back into normal flow (still visible, header height
     unchanged) rather than overlapping. */
  @media (max-width: 640px) {
    .fn-toggle-wrap { position: static; transform: none; margin-left: 8px; }
  }
  .provider-badge {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent-deep);
    font-size: 11.5px; font-weight: 600; letter-spacing: .2px;
    white-space: nowrap;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--faint); flex: none;
    transition: background .3s var(--ease), box-shadow .3s var(--ease);
  }
  .status-dot.on  { background: var(--ok);   box-shadow: 0 0 0 3px rgba(22,163,74,.16); }
  .status-dot.warn{ background: var(--warn); box-shadow: 0 0 0 3px rgba(217,119,6,.16); }

  .kb-toggle, .pill-group {
    display: flex; align-items: center; gap: 2px;
    padding: 3px; border-radius: 99px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .kb-opt, .pill-opt {
    padding: 5px 12px; border-radius: 99px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    white-space: nowrap;
    transition: background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .kb-opt:hover:not(:disabled):not(.active),
  .pill-opt:hover:not(:disabled):not(.active) { color: var(--text); }
  .kb-opt.active, .pill-opt.active { background: var(--surface); color: var(--accent-deep); box-shadow: 0 1px 4px rgba(23,32,58,.12); }
  .kb-opt:disabled, .pill-opt:disabled { color: var(--faint); cursor: not-allowed; }
  /* Retrieval sub-toggle is meaningless outside document retrieval. */
  body[data-mode="mcp"] #kbToggle { display: none; }
  /* The attach button only means something to the live-SAP side. */
  body:not([data-mode="mcp"]) #attachBtn { display: none; }

  /* ---------- sidebar ---------- */
  /* Scoped to #sidebar, not the bare `aside` element: the result drawer is also
     an <aside>, and a bare selector handed it the sidebar's width, padding and -
     worst - the side-collapsed `pointer-events: none`, which made the open
     drawer unclickable. */
  #sidebar {
    width: 264px; flex: none;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto; overflow-x: hidden;
    padding: 16px 14px 24px;
    display: flex; flex-direction: column; gap: 20px;
    transition: margin-left .5s var(--ease), transform .4s var(--ease), opacity .35s var(--ease);
  }
  #sidebar::-webkit-scrollbar { width: 5px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }

  @media (min-width: 761px) {
    .app.side-collapsed #sidebar { margin-left: -264px; opacity: 0; pointer-events: none; }
  }

  .side-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .7px;
    text-transform: uppercase; color: var(--faint);
  }
  .side-section { animation: fadeUp .4s var(--ease) both; }
  .side-section:nth-child(1) { animation-delay: .03s; }
  .side-section:nth-child(2) { animation-delay: .09s; }
  .side-section:nth-child(3) { animation-delay: .15s; }

  .new-chat-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 13px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-deep);
    font-size: 13px; font-weight: 600;
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
  }
  .new-chat-btn svg { width: 14px; height: 14px; flex: none; }
  .new-chat-btn:hover {
    background: #e3eaff; transform: translateY(-1px);
    box-shadow: 0 3px 12px rgba(46, 91, 255, .18);
  }
  .new-chat-btn:active { transform: scale(.98); }

  /* collapsible section header */
  .side-head {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 2px 2px 9px; border-radius: 6px;
  }
  .side-head .chev {
    color: var(--faint); display: inline-flex;
    transition: transform .4s var(--ease);
  }
  .side-head:hover .side-label { color: var(--muted); }
  .side-section.collapsed .side-head .chev { transform: rotate(-90deg); }

  .collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--ease); }
  .collapse > div { overflow: hidden; min-height: 0; transition: opacity .35s var(--ease); }
  .side-section.collapsed .collapse { grid-template-rows: 0fr; }
  .side-section.collapsed .collapse > div { opacity: 0; }

  .stat-card {
    border: 1px solid var(--border); border-radius: var(--r);
    padding: 12px 13px; display: flex; flex-direction: column; gap: 8px;
  }
  .stat-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
  .stat-row .k { color: var(--muted); flex: none; }
  .stat-row .v { font-weight: 600; text-align: right; word-break: break-word; min-width: 0; }

  /* chat history */
  .chats-label { padding: 2px 2px 9px; display: block; }
  .chat-list { display: flex; flex-direction: column; gap: 2px; }
  .chat-row {
    display: flex; align-items: center; border-radius: 8px;
    animation: fadeUp .35s var(--ease) both;
    transition: background .2s var(--ease);
  }
  .chat-row:hover { background: var(--bg); }
  .chat-row.active { background: var(--accent-soft); }
  .chat-open {
    flex: 1; min-width: 0; text-align: left;
    padding: 7px 10px; font-size: 12.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .2s var(--ease);
  }
  .chat-row:hover .chat-open { color: var(--text); }
  .chat-row.active .chat-open { color: var(--accent-deep); font-weight: 600; }
  .chat-del {
    width: 22px; height: 22px; margin-right: 5px; flex: none;
    border-radius: 6px; display: grid; place-items: center; color: var(--faint);
    opacity: 0; transform: scale(.7);
    transition: opacity .2s var(--ease), transform .25s var(--ease), color .2s var(--ease), background .2s var(--ease);
  }
  .chat-row:hover .chat-del { opacity: 1; transform: none; }
  .chat-del:hover { color: var(--danger); background: #fde2e2; }
  .chat-del svg { width: 12px; height: 12px; }
  .list-empty { font-size: 12px; color: var(--faint); padding: 2px 10px; }

  .backdrop {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(23, 32, 58, .35);
    opacity: 0; transition: opacity .3s var(--ease);
  }

  /* ---------- main / chat ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .chat-scroll { flex: 1 1 0px; overflow-y: auto; min-height: 0; transition: flex-grow .55s var(--ease); }
  main.empty .chat-scroll { flex-grow: 0; }
  .chat-scroll::-webkit-scrollbar { width: 6px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  .chat-column { max-width: 860px; margin: 0 auto; padding: 26px 24px 12px; }

  /* hero (empty state) */
  .hero-zone {
    flex: 0 1 0px; overflow: hidden; opacity: 0;
    display: flex; align-items: flex-end; justify-content: center;
    transition: flex-grow .55s var(--ease), opacity .45s var(--ease);
  }
  main.empty .hero-zone { flex-grow: 1; opacity: 1; }
  .greeting {
    font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -.6px;
    text-align: center; padding: 0 24px 30px;
    background: linear-gradient(100deg, var(--text), var(--accent), var(--accent2), var(--text));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: -300% 50%; }
  }
  main.empty .greeting { animation: fadeUp .6s var(--ease) both, gradientFlow 6s linear infinite; }
  .main-gap { flex: 0 1 0px; transition: flex-grow .55s var(--ease); }
  main.empty .main-gap { flex-grow: 1.25; }

  /* messages */
  .msg { display: flex; gap: 10px; margin-bottom: 20px; animation: fadeUp .35s var(--ease) both; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; color: #fff; margin-top: 2px;
  }
  .avatar svg { width: 15px; height: 15px; }
  .msg.bot  .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .msg.user .avatar { background: linear-gradient(135deg, #64708c, #444d66); }

  .bubble-wrap { max-width: 72%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .msg.user .bubble-wrap { align-items: flex-end; }
  .bubble { padding: 11px 15px; font-size: 14px; overflow-wrap: break-word; }
  .msg.user .bubble {
    background: var(--accent); color: #fff;
    border-radius: 18px 18px 4px 18px;
  }
  .msg.bot .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px 18px 18px 4px;
  }

  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble h4 { font-size: 13px; font-weight: 700; margin: 10px 0 5px; }
  .bubble ol, .bubble ul { margin: 4px 0 8px; padding-left: 20px; }
  .bubble li { margin-bottom: 3px; }
  .bubble code {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .note-link {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 0 7px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent-deep);
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .note-link:hover { background: #e3eaff; text-decoration: none; }

  .bubble.error-note {
    border-color: #fde2e2; background: #fef6f6; color: #8f2f2f; font-size: 13px;
  }
  .meta-line { font-size: 11px; color: var(--faint); padding: 0 4px; }

  /* sources disclosure */
  .src-toggle {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), color .25s var(--ease);
  }
  .src-toggle:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(23,32,58,.07); color: var(--text); }
  .src-toggle.open { color: var(--accent-deep); border-color: #ccd8ff; background: var(--accent-soft); }
  .src-toggle .chev { transition: transform .3s var(--ease); display: inline-flex; }
  .src-toggle.open .chev { transform: rotate(180deg); }

  .src-panel { display: none; animation: fadeUp .3s var(--ease) both; width: 100%; }
  .src-panel.open { display: block; }
  .table-shell {
    border: 1px solid var(--border); border-radius: var(--r);
    overflow: hidden; background: var(--surface);
  }
  .table-scroll { max-height: 240px; overflow: auto; }
  .table-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg); text-align: left;
    font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--faint); padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .15s var(--ease); }
  tbody tr:hover { background: var(--bg); }
  .table-note { font-size: 11px; color: var(--faint); padding: 7px 12px; background: var(--bg); border-top: 1px solid var(--border); }
  .score-pill {
    display: inline-block; padding: 0 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent-deep);
    font-weight: 600; font-size: 11px;
  }

  /* loading dots */
  .dots { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--faint);
    animation: pulse 1.1s var(--ease) infinite;
  }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse {
    0%, 70%, 100% { transform: scale(.75); opacity: .45; }
    30% { transform: scale(1.05); opacity: 1; }
  }

  /* ---------- composer ---------- */
  .composer-bar { flex: none; padding: 10px 24px 18px; }
  .composer-anchor {
    position: relative; max-width: 860px; margin: 0 auto;
    transition: max-width .55s var(--ease);
  }
  main.empty .composer-anchor { max-width: 720px; }
  .composer {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 9px 9px 9px 16px;
    transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .composer:focus-within { border-color: #b9c8ff; box-shadow: 0 3px 12px rgba(46,91,255,.10); }
  .composer textarea {
    flex: 1; border: 0; outline: 0; resize: none;
    font: inherit; color: inherit; background: transparent;
    max-height: 140px; padding: 5px 0; line-height: 1.45;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .send-btn {
    width: 36px; height: 36px; flex: none; border-radius: 99px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), opacity .25s var(--ease);
  }
  .send-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(46, 91, 255, .35);
    background: var(--accent-deep);
  }
  .send-btn:disabled { opacity: .45; cursor: default; }
  .send-btn svg { width: 16px; height: 16px; }
  .composer-hint {
    max-width: 860px; margin: 7px auto 0;
    font-size: 11px; color: var(--faint); text-align: center;
    transition: opacity .4s var(--ease);
  }
  main.empty .composer-hint { opacity: 0; }

  /* hover-revealed suggestions */
  .suggest-pop {
    position: absolute; top: calc(100% + 12px); left: 0; right: 0;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    pointer-events: none; z-index: 5;
  }
  .chip {
    text-align: center; padding: 7px 14px; border-radius: 99px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-size: 12.5px; font-weight: 500; line-height: 1.35;
    box-shadow: 0 2px 10px rgba(23, 32, 58, .06);
    opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none;
    transition: opacity .35s var(--ease), transform .35s var(--ease),
                color .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  main.empty .composer-anchor:hover .chip,
  main.empty .composer-anchor:focus-within .chip {
    opacity: 1; transform: none; pointer-events: auto;
  }
  main.empty .composer-anchor .chip:hover {
    transform: translateY(-2px); color: var(--accent-deep);
    border-color: #ccd8ff; box-shadow: 0 5px 16px rgba(46, 91, 255, .15);
  }
  .composer-anchor.has-text .chip {
    opacity: 0 !important; transform: translateY(8px) scale(.96) !important;
    pointer-events: none !important;
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; bottom: 26px; left: 50%; z-index: 60;
    transform: translate(-50%, 14px);
    background: var(--text); color: #fff;
    padding: 10px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 26px rgba(23, 32, 58, .28);
    opacity: 0; pointer-events: none;
    transition: opacity .35s var(--ease), transform .35s var(--ease);
    max-width: min(520px, 88vw);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- composer attachments (the + button) ---------- */
  /* The + sits where the composer's left padding was, so the padding shrinks
     only in the mode that shows it. */
  body[data-mode="mcp"] .composer { padding-left: 9px; }
  .attach-btn {
    flex: none; width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: var(--muted);
    transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .attach-btn svg { width: 17px; height: 17px; }
  .attach-btn:hover { background: var(--accent-soft); color: var(--accent-deep); }
  .attach-btn:active { transform: scale(.92); }
  .attach-btn.busy { opacity: .5; pointer-events: none; }

  .attach-row {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 0 4px 8px;
  }
  .attach-row:empty { display: none; }
  .attach-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px 5px 9px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; max-width: 260px;
    animation: popIn .28s var(--ease) both;
  }
  .attach-chip svg.file-ic { width: 13px; height: 13px; flex: none; color: var(--accent); }
  .attach-chip .fn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .sz { color: var(--faint); flex: none; font-size: 11px; }
  .attach-chip .x {
    flex: none; width: 16px; height: 16px; border-radius: 5px;
    display: grid; place-items: center; color: var(--faint); font-size: 13px; line-height: 1;
  }
  .attach-chip .x:hover { background: var(--bg); color: var(--danger); }
  .attach-chip.uploading { opacity: .6; }

  /* composer drag-over affordance: the whole composer becomes the drop target */
  .composer.drag-over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- result card (in chat) + side drawer ---------- */
  .result-card {
    display: flex; align-items: center; gap: 11px; width: 100%;
    margin-top: 10px; padding: 11px 13px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    text-align: left;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
    animation: fadeUp .35s var(--ease) both;
  }
  .result-card:hover {
    border-color: var(--accent); transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(23, 32, 58, .1);
  }
  .result-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .rc-icon {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: #fff;
  }
  .rc-icon svg { width: 15px; height: 15px; }
  .rc-icon.good { background: var(--ok); }
  .rc-icon.warn { background: var(--warn); }
  .rc-icon.bad { background: var(--danger); }
  .rc-text { flex: 1; min-width: 0; }
  .rc-title { display: block; font-size: 13px; font-weight: 650; }
  .rc-sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .rc-open { flex: none; font-size: 11.5px; font-weight: 600; color: var(--accent-deep); }

  /* The drawer is a flex sibling of <main>, so opening it genuinely narrows the
     chat instead of covering it - the chat reflows, same as Claude's artifact
     view. The left sidebar is collapsed by JS at the same moment. */
  #drawer {
    flex: none; width: 0; min-width: 0; overflow: hidden;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width .45s var(--ease);
  }
  .app.drawer-open #drawer { width: min(560px, 46vw); }
  .drawer-head {
    flex: none; height: 48px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; border-bottom: 1px solid var(--border);
  }
  .drawer-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-close {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .drawer-close svg { width: 15px; height: 15px; }
  .drawer-close:hover { background: var(--bg); color: var(--text); }
  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 13px; }
  .drawer-body::-webkit-scrollbar { width: 6px; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

  @media (max-width: 900px) {
    /* No room to sit side by side - the drawer takes the screen. */
    .app.drawer-open #drawer {
      position: fixed; top: 52px; right: 0; bottom: 0; left: 0;
      width: auto; z-index: 40; border-left: 0;
    }
  }

  /* Flowing sections, not boxed cards: a bottom divider separates one
     section from the next instead of a background+border+radius shell
     around each - the shell added no contrast (card bg == drawer bg) and
     stacked sections had no gap between them, so it just read as clutter. */
  .inv-card {
    padding: 4px 0 22px;
    border-bottom: 1px solid var(--border);
    animation: fadeUp .4s var(--ease) both;
  }
  .inv-card:last-child { border-bottom: 0; padding-bottom: 4px; }
  .inv-card h3 {
    font-size: 13.5px; font-weight: 700;
    color: var(--text); margin-bottom: 12px;
  }

  /* trace steps */
  .trace-step {
    display: flex; gap: 11px; padding: 7px 0;
    border-top: 1px solid var(--border);
    animation: fadeUp .32s var(--ease) both;
  }
  .trace-step:first-of-type { border-top: 0; padding-top: 0; }
  .trace-dot {
    width: 16px; height: 16px; flex: none; margin-top: 2px; border-radius: 99px;
    display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #fff;
  }
  .trace-dot.ok { background: var(--ok); }
  .trace-dot.warn { background: var(--warn); }
  .trace-dot.error { background: var(--danger); }
  .trace-dot.running { background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
  .trace-body { min-width: 0; flex: 1; }
  .trace-label { font-size: 13px; font-weight: 500; }
  .trace-meta { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .trace-meta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .trace-data {
    margin-top: 6px; padding: 7px 9px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    /* Capped so one verbose step (a full variance struct) can't push the actual
       result off the panel; the detail is still there, just scrolled. */
    max-height: 132px; overflow: auto;
  }

  /* outcome banner */
  .inv-outcome {
    display: flex; align-items: center; gap: 9px; margin-bottom: 18px;
    padding: 11px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
    animation: popIn .35s var(--ease) both;
  }
  .inv-outcome.good { background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; }
  .inv-outcome.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .inv-outcome.bad  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

  .inv-pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; line-height: 1.65; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px; overflow-x: auto;
  }
  .inv-warn-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .inv-warn {
    font-size: 12px; color: #92400e; background: #fffbeb;
    border: 1px solid #fde68a; border-radius: 8px; padding: 7px 10px;
  }
  .approve-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 13px; }
  .approve-btn {
    padding: 9px 17px; border-radius: 10px; background: var(--ok); color: #fff;
    font-size: 13px; font-weight: 600;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
  }
  .approve-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(22, 163, 74, .28); }
  .approve-btn:disabled { background: var(--border-strong); color: var(--faint); cursor: not-allowed; }
  .approve-note { font-size: 11.5px; color: var(--muted); flex: 1; min-width: 180px; }

  .var-row {
    display: flex; gap: 9px; padding: 8px 0; border-top: 1px solid var(--border);
    font-size: 12.5px;
  }
  .var-row:first-of-type { border-top: 0; padding-top: 0; }
  .var-tag {
    flex: none; align-self: flex-start; padding: 2px 8px; border-radius: 99px;
    background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
    font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
  }
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 9px 16px; }
  .kv { min-width: 0; }
  .kv .k { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); font-weight: 700; }
  .kv .v { font-size: 13px; font-weight: 600; word-break: break-word; }
  /* A long-form field (e.g. a review's "detail" explanation) doesn't fit the
     kv-grid's narrow auto-fit columns - give it its own full-width row below
     instead of squeezing prose into a 150px cell. */
  .kv-full { margin-top: 12px; }
  .kv-full .k { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); font-weight: 700; margin-bottom: 4px; }
  .kv-full .v { display: block; font-size: 13px; font-weight: 500; line-height: 1.55; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .conf { font-size: 10.5px; font-weight: 600; margin-left: 5px; }
  .conf.hi { color: var(--ok); }
  .conf.lo { color: var(--warn); }

  /* ---------- editable SAP-style proposal fields ---------- */
  .field-section + .field-section { margin-top: 16px; }
  .field-section h4 {
    font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--faint); margin-bottom: 8px;
  }
  .field-row {
    display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 1.4fr);
    align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border);
  }
  .field-row:first-of-type { border-top: 0; padding-top: 0; }
  .field-label { font-size: 12.5px; font-weight: 600; min-width: 0; }
  .field-tech {
    display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; font-weight: 500; color: var(--faint); margin-top: 1px;
  }
  .field-control { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .field-input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 12.5px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 6px 9px; transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-row-locked .field-value {
    font-size: 12.5px; color: var(--muted); padding: 6px 9px;
    background: var(--bg); border: 1px dashed var(--border-strong); border-radius: 8px; flex: 1;
  }
  .conf-badge {
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .2px;
    padding: 2px 7px; border-radius: 99px; white-space: nowrap;
  }
  .conf-badge.po   { background: var(--accent-soft); color: var(--accent-deep); }
  .conf-badge.sys  { background: var(--border); color: var(--muted); }
  .conf-badge.locked { background: var(--border); color: var(--faint); }
  .field-form-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 13px; }
  .apply-edits-btn {
    padding: 8px 15px; border-radius: 10px; background: var(--surface); color: var(--accent-deep);
    border: 1px solid var(--accent); font-size: 12.5px; font-weight: 600;
    transition: background .2s var(--ease), transform .2s var(--ease);
  }
  .apply-edits-btn:hover:not(:disabled) { background: var(--accent-soft); transform: translateY(-1px); }
  .apply-edits-btn:disabled { border-color: var(--border-strong); color: var(--faint); cursor: not-allowed; }
  .apply-edits-note { font-size: 11.5px; color: var(--muted); flex: 1; min-width: 180px; }

  /* ---------- animations ---------- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn  { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
      transition-duration: .01ms !important;
    }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    #sidebar {
      position: fixed; top: 52px; bottom: 0; left: 0; z-index: 25;
      margin-left: 0 !important; opacity: 1 !important;
      transform: translateX(-100%);
      box-shadow: 0 10px 40px rgba(23,32,58,.18);
    }
    #sidebar.open { transform: translateX(0); }
    .backdrop.show { display: block; opacity: 1; }
    .bubble-wrap { max-width: 88%; }
    .chat-column, .composer-bar { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
    </button>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 12 3 7m9 5 9-5m-9 5v10"/></svg>
      </div>
      <span class="logo-name">SAP Helper</span>
    </div>

    <div class="fn-toggle-wrap">
      <div class="pill-group" id="fnToggle" role="radiogroup" aria-label="Chatbot function">
        <button class="pill-opt" id="fnDocs" data-fn="documents" role="radio" title="Answer from SAP Notes / knowledge base documents">Knowledge Base</button>
        <button class="pill-opt" id="fnMcp" data-fn="mcp" role="radio" title="Live read-only lookups against the SAP S/4HANA tenant. Attach an invoice to run the 3-way match">SAP MCP</button>
      </div>
    </div>

    <div class="header-right">
      <div class="kb-toggle" id="kbToggle" role="radiogroup" aria-label="Knowledge base">
        <button class="kb-opt" id="kbLocal" data-kb="local" role="radio" title="Retrieve from the local Qdrant vector store">Local KB</button>
        <button class="kb-opt" id="kbBedrock" data-kb="bedrock" role="radio" title="Retrieve from Amazon Bedrock Knowledge Base">Bedrock KB</button>
      </div>
      <div class="provider-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="providerLabel">connecting…</span>
      </div>
    </div>
  </header>

  <div class="body">
    <aside id="sidebar">
      <div class="side-section">
        <button class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>

      <div class="side-section" id="sysSection">
        <button class="side-head" id="sysToggle" aria-expanded="true" aria-controls="sysBody">
          <span class="side-label">System</span>
          <span class="chev">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </button>
        <div class="collapse" id="sysBody">
          <div>
            <div class="stat-card" id="statCard">
              <div class="stat-row"><span class="k">Status</span><span class="v">loading…</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="side-section" id="chatsSection">
        <span class="side-label chats-label">Chats</span>
        <div class="chat-list" id="chatList"></div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main id="main" class="empty">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-column" id="chatColumn"></div>
      </div>

      <div class="hero-zone" id="heroZone">
        <h1 class="greeting" id="greeting">Hello</h1>
      </div>

      <div class="composer-bar">
        <div class="composer-anchor" id="composerAnchor">
          <div class="attach-row" id="attachRow"></div>
          <div class="composer" id="composer">
            <button class="attach-btn" id="attachBtn" aria-label="Attach a file" title="Attach an invoice (JPEG, PNG or PDF)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="e.g. HANA indexserver crashes with OOM during delta merge…"></textarea>
            <button class="send-btn" id="sendBtn" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
            <input type="file" id="attachFile" accept="image/jpeg,image/png,application/pdf" hidden>
          </div>
          <div class="suggest-pop" id="suggestPop"></div>
        </div>
        <div class="composer-hint">Enter to send · Shift + Enter for a new line</div>
      </div>

      <div class="main-gap"></div>
    </main>

    <!-- Result drawer: a flex sibling of <main>, so opening it narrows the chat
         rather than covering it. Everything inside is rendered from the
         pipeline's structured result - no figure is computed client-side. -->
    <aside id="drawer" aria-label="Result panel">
      <div class="drawer-head">
        <div class="drawer-title" id="drawerTitle">Result</div>
        <button class="drawer-close" id="drawerClose" aria-label="Close panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var USER_NAME = "User";

  // The two compartmentalized chatbot functions. Everything that differs
  // between them - endpoint, request shape, localStorage bucket, suggestion
  // chips, composer placeholder - lives here; the retrieval sub-toggle is
  // shown/hidden purely by CSS via body[data-mode]. buildPayload closes over
  // currentKB (defined below) and is only invoked at send time, so ordering
  // is fine.
  var MODES = {
    documents: {
      label: "Knowledge Base",
      endpoint: "/api/query",
      storageKey: "sapHelperChats",
      placeholder: "e.g. HANA indexserver crashes with OOM during delta merge…",
      buildPayload: function (q, history, attachments) {
        return { question: q, history: history, knowledge_base: currentKB };
      },
      suggestions: [
        "HANA indexserver crashes with out of memory during delta merge",
        "RFC call fails with CALL_FUNCTION_SEND_ERROR after kernel patch",
        "Fiori launchpad tiles show 'App could not be opened' after upgrade",
        "Transport request stuck in RDDIMPDP, import hangs in SE01",
        "Background job cancelled with SQL error 1653 unable to extend segment"
      ]
    },
    mcp: {
      label: "SAP MCP",
      endpoint: "/api/mcp/query",
      storageKey: "sapMcpChats",
      placeholder: "e.g. What's the status of PO 4500000123?",
      // Attachment ids for the turn ride along here; the model decides whether
      // to run the invoice agent on them or answer the question it was asked.
      // They are passed IN rather than read from `pending`, because send()
      // clears the composer before building the payload.
      buildPayload: function (q, history, attachments) {
        return { question: q, history: history, attachments: attachments || [] };
      },
      suggestions: [
        "What's the status of PO 4500000123?",
        "Compare PO 4500000123 against its goods receipts",
        "Check this invoice against its PO and goods receipt",
        "Look up the supplier code for domestic steel",
        "Which plant is code 1710?"
      ]
    },
  };

  var currentMode = "documents";
  try {
    var storedMode = localStorage.getItem("sapHelperMode");
    if (MODES[storedMode]) currentMode = storedMode;
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var appEl = $("app"), mainEl = $("main");
  var chatScroll = $("chatScroll"), chatColumn = $("chatColumn");
  var input = $("input"), sendBtn = $("sendBtn"), toast = $("toast");
  var anchor = $("composerAnchor");
  var busy = false, noteUrlById = {}, currentChatId = null;
  // Each function keeps its own open-chat pointer so switching modes restores
  // the conversation you were last looking at in that mode.
  var modeCurrentChatId = { documents: null, mcp: null };

  /* ---------- knowledge base toggle ---------- */
  var kbButtons = { local: $("kbLocal"), bedrock: $("kbBedrock") };
  var currentKB = "local";
  try {
    var storedKB = localStorage.getItem("sapKnowledgeBase");
    if (storedKB === "local" || storedKB === "bedrock") currentKB = storedKB;
  } catch (e) {}

  function renderKBToggle() {
    Object.keys(kbButtons).forEach(function (kb) {
      kbButtons[kb].classList.toggle("active", kb === currentKB);
    });
  }
  function setKB(kb) {
    if (kbButtons[kb].disabled || kb === currentKB) return;
    currentKB = kb;
    try { localStorage.setItem("sapKnowledgeBase", kb); } catch (e) {}
    renderKBToggle();
  }
  Object.keys(kbButtons).forEach(function (kb) {
    kbButtons[kb].addEventListener("click", function () { setKB(kb); });
  });
  renderKBToggle();

  /* ---------- time-aware greeting ---------- */
  function refreshGreeting() {
    var h = new Date().getHours(), g;
    if (h >= 5 && h < 12) g = "Good morning";
    else if (h >= 12 && h < 17) g = "Good afternoon";
    else g = "Good evening";
    $("greeting").textContent = g + ", " + USER_NAME;
  }
  refreshGreeting();
  setInterval(refreshGreeting, 60000);

  /* ---------- sidebar toggle (desktop collapse + mobile drawer) ---------- */
  var sidebar = $("sidebar"), backdrop = $("backdrop");
  function isMobile() { return window.matchMedia("(max-width: 760px)").matches; }
  $("menuBtn").addEventListener("click", function () {
    if (isMobile()) {
      sidebar.classList.toggle("open");
      backdrop.classList.toggle("show", sidebar.classList.contains("open"));
    } else {
      var collapsed = appEl.classList.toggle("side-collapsed");
      try { localStorage.setItem("sapSideCollapsed", collapsed ? "1" : "0"); } catch (e) {}
    }
  });
  backdrop.addEventListener("click", function () {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
  });
  window.addEventListener("resize", function () {
    if (!isMobile()) {
      sidebar.classList.remove("open");
      backdrop.classList.remove("show");
    }
  });
  try {
    if (localStorage.getItem("sapSideCollapsed") === "1") appEl.classList.add("side-collapsed");
  } catch (e) {}

  /* ---------- collapsible System section ---------- */
  var sysSection = $("sysSection"), sysToggle = $("sysToggle");
  sysToggle.addEventListener("click", function () {
    var collapsed = sysSection.classList.toggle("collapsed");
    sysToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    try { localStorage.setItem("sapSysCollapsed", collapsed ? "1" : "0"); } catch (e) {}
  });
  try {
    if (localStorage.getItem("sapSysCollapsed") === "1") {
      sysSection.classList.add("collapsed");
      sysToggle.setAttribute("aria-expanded", "false");
    }
  } catch (e) {}

  /* ---------- toast ---------- */
  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 4200);
  }

  /* ---------- status ---------- */
  // One /api/status response carries both functions' status; cache it and
  // render whichever the active mode needs (also re-rendered on mode switch,
  // no extra round-trip).
  var lastStatus = null;

  function statRow(k, v) {
    return '<div class="stat-row"><span class="k">' + k + '</span><span class="v">' + v + "</span></div>";
  }

  // Live matching tolerances, so the sidebar reflects a runtime override
  // (POST /api/invoice/tolerances) without a restart or a page reload.
  var lastTolerances = null;
  function tolRows() {
    if (!lastTolerances) return "";
    var t = lastTolerances;
    return statRow("Price tol.", (t.price_pct * 100).toFixed(1) + "% + " + t.price_abs) +
      statRow("Qty tol.", (t.quantity_pct * 100).toFixed(1) + "% + " + t.quantity_abs);
  }
  function loadTolerances() {
    fetch("/api/invoice/tolerances").then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) { lastTolerances = d.tolerances; renderStatusPanel(); }
    }).catch(function () {});
  }

  function renderStatusPanel() {
    var s = lastStatus;
    var dot = $("statusDot");
    dot.classList.remove("on", "warn");
    if (!s) return;
    var ok, prov, model, rows;
    if (currentMode === "mcp") {
      ok = s.mcp_ok; prov = s.mcp_provider; model = s.mcp_model;
      rows = statRow("Provider", esc(prov)) +
        statRow("Model", esc(model)) +
        statRow("SAP tenant", s.sap_configured ? "configured" : "not configured") +
        statRow("Tools", "6 read-only + invoice") +
        tolRows();
    } else {
      ok = s.ok; prov = s.provider; model = s.model;
      rows = statRow("Provider", esc(prov)) +
        statRow("Model", esc(model)) +
        statRow("Embeddings", esc((s.embedding_model || "").split("/").pop())) +
        statRow("Vector store", esc(s.vector_store)) +
        statRow("Notes indexed", s.indexed_documents) +
        statRow("Chunks", s.indexed_chunks);
    }
    $("statCard").innerHTML = rows;
    $("providerLabel").textContent = String(prov).toUpperCase() + " · " + model;
    dot.classList.add(ok ? "on" : "warn");
  }

  function loadStatus() {
    fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
      lastStatus = s;
      renderStatusPanel();
      if (!s.ok && currentMode === "documents") {
        showToast("Generation backend not configured. Retrieval still works, answers are disabled.");
      }

      var kbs = s.knowledge_bases || { local: true, bedrock: false };
      Object.keys(kbButtons).forEach(function (kb) {
        var available = kbs[kb] !== false;
        kbButtons[kb].disabled = !available;
        kbButtons[kb].title = available
          ? kbButtons[kb].title
          : "Bedrock Knowledge Base not configured (set BEDROCK_KB_ID)";
      });
      if (kbButtons[currentKB].disabled) setKB(kbs.local !== false ? "local" : "bedrock");
      renderKBToggle();
    }).catch(function () {
      $("providerLabel").textContent = "offline";
    });
  }
  loadStatus();

  /* ---------- suggestions (revealed on composer hover/focus) ---------- */
  function renderSuggestions() {
    var host = $("suggestPop");
    host.innerHTML = "";
    MODES[currentMode].suggestions.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "chip";
      b.textContent = s;
      b.style.transitionDelay = (i * 45) + "ms";
      b.addEventListener("click", function () { input.value = s; autoGrow(); send(); });
      host.appendChild(b);
    });
  }

  /* ---------- chat history (per-mode localStorage sessions) ---------- */
  // Each function stores its chats under its own key, so the two interfaces
  // never share history.
  function loadChats(mode) {
    try { return JSON.parse(localStorage.getItem(MODES[mode].storageKey) || "[]"); }
    catch (e) { return []; }
  }
  var chats = loadChats(currentMode);
  function saveChats() {
    chats = chats.slice(0, 30);
    try { localStorage.setItem(MODES[currentMode].storageKey, JSON.stringify(chats)); } catch (e) {}
  }
  function getChat(id) {
    for (var i = 0; i < chats.length; i++) if (chats[i].id === id) return chats[i];
    return null;
  }

  var HISTORY_MAX_TURNS = 10;

  // Maps this chat's stored messages to the {role, content} shape the
  // server expects, dropping errored bot turns (no answer to feed back
  // in) and capping length client-side (server enforces its own cap
  // independently, so this is just to keep the request payload small).
  function buildHistory(messages) {
    var out = [];
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      if (m.role === "user") {
        out.push({ role: "user", content: m.text });
      } else if (m.role === "bot" && m.data && m.data.answer) {
        out.push({ role: "assistant", content: m.data.answer });
      }
    }
    return out.slice(-HISTORY_MAX_TURNS);
  }

  var delIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  function renderHistory() {
    var host = $("chatList");
    host.innerHTML = "";
    if (!chats.length) {
      host.innerHTML = '<div class="list-empty">No chats yet</div>';
      return;
    }
    chats.forEach(function (c, i) {
      var row = document.createElement("div");
      row.className = "chat-row" + (c.id === currentChatId ? " active" : "");
      row.style.animationDelay = Math.min(i * 35, 300) + "ms";

      var open = document.createElement("button");
      open.className = "chat-open";
      open.textContent = c.title;
      open.title = c.title;
      open.addEventListener("click", function () { openChat(c.id); });

      var del = document.createElement("button");
      del.className = "chat-del";
      del.setAttribute("aria-label", "Delete chat");
      del.innerHTML = delIcon;
      del.addEventListener("click", function () { deleteChat(c.id); });

      row.appendChild(open);
      row.appendChild(del);
      host.appendChild(row);
    });
  }

  function setEmpty(on) { mainEl.classList.toggle("empty", on); }

  function newChat() {
    currentChatId = null;
    chatColumn.innerHTML = "";
    noteUrlById = {};
    if (pending.length) { pending = []; renderAttachRow(); }
    closeDrawer();
    setEmpty(true);
    renderHistory();
    if (isMobile()) { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
    input.focus();
  }

  function openChat(id) {
    var c = getChat(id);
    if (!c) return;
    currentChatId = id;
    chatColumn.innerHTML = "";
    noteUrlById = {};
    setEmpty(false);
    closeDrawer();
    c.messages.forEach(function (m, i) {
      var el = m.role === "user"
        ? buildUserEl(m.text, m.attachments)
        : buildBotEl(m.data);
      el.style.animationDelay = Math.min(i * 45, 400) + "ms";
      chatColumn.appendChild(el);
    });
    renderHistory();
    if (isMobile()) { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
    scrollToEnd(false);
  }

  function deleteChat(id) {
    chats = chats.filter(function (c) { return c.id !== id; });
    saveChats();
    if (currentChatId === id) newChat();
    else renderHistory();
  }

  $("newChatBtn").addEventListener("click", newChat);

  /* ---------- rendering ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function linkNotes(html) {
    return html.replace(/\[?\bNote\s+(\d{6,10})\]?/g, function (_m, id) {
      var url = noteUrlById[id] || ("https://me.sap.com/notes/" + id);
      return '<a class="note-link" href="' + url + '" target="_blank" rel="noopener">Note ' + id + "</a>";
    });
  }

  // Minimal markdown: headings, bold, inline code, ordered/unordered lists.
  function renderMarkdown(text) {
    var lines = esc(text).split(/\r?\n/), out = [], list = null;
    function closeList() { if (list) { out.push(list === "ol" ? "</ol>" : "</ul>"); list = null; } }
    lines.forEach(function (line) {
      var t = line.trim();
      var m;
      if ((m = t.match(/^#{1,4}\s+(.*)$/))) { closeList(); out.push("<h4>" + m[1] + "</h4>"); return; }
      if ((m = t.match(/^(\d+)[.)]\s+(.*)$/))) {
        if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
        out.push("<li>" + m[2] + "</li>"); return;
      }
      if ((m = t.match(/^[-*•]\s+(.*)$/))) {
        if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
        out.push("<li>" + m[1] + "</li>"); return;
      }
      closeList();
      if (t) out.push("<p>" + t + "</p>");
    });
    closeList();
    var html = out.join("");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    return linkNotes(html);
  }

  var botAvatar = '<div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2m0-12.8-2.2 2.2M7.8 16.2l-2.2 2.2"/></svg></div>';
  var userAvatar = '<div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.3-3.2 3.8-4.8 7-4.8s5.7 1.6 7 4.8"/></svg></div>';

  function buildUserEl(text, attachments) {
    var el = document.createElement("div");
    el.className = "msg user";
    var chips = (attachments || []).map(function (a) {
      return '<div class="attach-chip">' +
        '<svg class="file-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' +
        '<span class="fn">' + esc(a.filename || "attachment") + "</span>" +
        '<span class="sz">' + esc(fmtSize(a.size)) + "</span></div>";
    }).join("");
    el.innerHTML = userAvatar + '<div class="bubble-wrap">' +
      (chips ? '<div class="attach-row" style="justify-content:flex-end">' + chips + "</div>" : "") +
      '<div class="bubble"></div></div>';
    el.querySelector(".bubble").textContent = text;
    return el;
  }

  function buildBotEl(data) {
    var el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = botAvatar + '<div class="bubble-wrap"></div>';
    renderBotInto(el.querySelector(".bubble-wrap"), data);
    return el;
  }

  function addLoading() {
    var el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = botAvatar +
      '<div class="bubble-wrap"><div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div></div>';
    chatColumn.appendChild(el);
    scrollToEnd();
    return el;
  }

  function sourcesTable(data) {
    var citations = data.citations || [];
    if (!citations.length) return "";
    var rows = citations.map(function (c) {
      return "<tr>" +
        '<td><a href="' + c.url + '" target="_blank" rel="noopener" class="note-link">Note ' + esc(c.note_id) + "</a></td>" +
        "<td>" + esc(c.title) + "</td>" +
        "<td>" + esc(c.component || "–") + "</td>" +
        "<td>" + esc(c.sections.join(", ")) + "</td>" +
        '<td><span class="score-pill">' + c.score.toFixed(2) + "</span></td>" +
        "</tr>";
    }).join("");
    return '<div class="src-panel">' +
      '<div class="table-shell"><div class="table-scroll"><table>' +
      "<thead><tr><th>Note</th><th>Title</th><th>Component</th><th>Matched sections</th><th>Score</th></tr></thead>" +
      "<tbody>" + rows + "</tbody></table></div>" +
      '<div class="table-note">Showing ' + citations.length + " note" + (citations.length === 1 ? "" : "s") +
      " from " + (data.chunks || []).length + " retrieved chunks · " + (data.latency_ms || 0) + " ms</div>" +
      "</div></div>";
  }

  function renderBotInto(wrap, data) {
    data = data || {};
    var citations = data.citations || [];
    citations.forEach(function (c) { noteUrlById[c.note_id] = c.url; });
    var parts = [];
    if (data.answer) {
      parts.push('<div class="bubble">' + renderMarkdown(data.answer) + "</div>");
    }
    if (data.error) {
      parts.push('<div class="bubble error-note">' + esc(data.error) + "</div>");
    }
    if (citations.length) {
      parts.push(
        '<button class="src-toggle"><span class="lbl">Show sources</span> (' + citations.length + ')' +
        '<span class="chev"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button>'
      );
      parts.push(sourcesTable(data));
    }
    // Structured results the chat can't carry as prose get a card that opens the
    // side drawer. Registered under a stable key so a reloaded chat still opens
    // the right run.
    (data.panels || []).forEach(function (panel, i) {
      // run_id is unique per pipeline run, so the key survives a reload and a
      // card always reopens its own run.
      var key = "p" + (panel.run_id || "x") + "_" + i;
      panelStore[key] = panel;
      parts.push(renderResultCard(key, panel));
    });
    if (data.provider) {
      var kbLabel = data.knowledge_base === "bedrock" ? "Bedrock KB" : data.knowledge_base === "local" ? "Local KB" : "";
      parts.push('<div class="meta-line">' + (kbLabel ? esc(kbLabel) + " · " : "") +
        esc(data.provider) + " · " + esc(data.model) + " · " + (data.latency_ms || 0) + " ms</div>");
    }
    if (!parts.length) {
      parts.push('<div class="bubble error-note">Empty response.</div>');
    }
    wrap.innerHTML = parts.join("");

    var toggle = wrap.querySelector(".src-toggle");
    if (toggle) {
      var panel = wrap.querySelector(".src-panel");
      toggle.addEventListener("click", function () {
        var open = panel.classList.toggle("open");
        toggle.classList.toggle("open", open);
        toggle.querySelector(".lbl").textContent = open ? "Hide sources" : "Show sources";
        if (open) scrollToEnd();
      });
    }
    wireResultCards(wrap);
  }

  function scrollToEnd(smooth) {
    requestAnimationFrame(function () {
      if (smooth === false) chatScroll.scrollTop = chatScroll.scrollHeight;
      else chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: "smooth" });
    });
  }

  /* ---------- send ---------- */
  function send() {
    var q = input.value.trim();
    if (!q || busy) return;
    if (pending.some(function (a) { return a.uploading; })) {
      showToast("Wait for the attachment to finish uploading.");
      return;
    }
    busy = true;
    sendBtn.disabled = true;
    // Snapshot the attachments for THIS turn, then clear the composer, so a
    // second message doesn't silently re-send the same file.
    var turnAttachments = pending.map(function (a) {
      return { filename: a.filename, size: a.size, attachment_id: a.attachment_id };
    });
    var turnIds = attachmentIds();
    pending = [];
    renderAttachRow();
    input.value = "";
    autoGrow();

    // Minted here so the trace can be streamed while the turn is still in
    // flight; the server threads it into the pipeline if the model runs one.
    var runId = turnIds.length ? newRunId() : "";

    if (!currentChatId) {
      var chat = {
        id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: q.length > 44 ? q.slice(0, 44) + "…" : q,
        ts: Date.now(),
        messages: []
      };
      chats.unshift(chat);
      currentChatId = chat.id;
    } else {
      var cur = getChat(currentChatId);
      chats = [cur].concat(chats.filter(function (x) { return x.id !== currentChatId; }));
    }
    var history = buildHistory(getChat(currentChatId).messages);
    getChat(currentChatId).messages.push({ role: "user", text: q, attachments: turnAttachments });
    saveChats();
    renderHistory();

    setEmpty(false);
    chatColumn.appendChild(buildUserEl(q, turnAttachments));
    scrollToEnd();
    var loading = addLoading();
    var sentChatId = currentChatId;

    // A file was attached: open the drawer now and stream the agent's steps as
    // they happen, rather than making the user wait on a blank screen and then
    // dumping a finished trace. If the model decides this was not an invoice
    // request, no events arrive and the drawer closes on delivery.
    if (runId) beginInvoiceRun(runId, turnAttachments.length ? turnAttachments[0].filename : "");

    function deliver(data) {
      var chat = getChat(sentChatId);
      if (chat) {
        chat.messages.push({ role: "bot", data: data });
        saveChats();
      }
      if (currentChatId === sentChatId) {
        if (document.body.contains(loading)) {
          renderBotInto(loading.querySelector(".bubble-wrap"), data);
        } else {
          chatColumn.appendChild(buildBotEl(data));
        }
        scrollToEnd();
      }
      stopTracePoll();
      var panels = data.panels || [];
      if (runId && !panels.length) {
        // The server always sends back a panel for a resolved attachment now
        // (a real run, or a "not_run" note when the model answered without
        // calling the tool) - so getting here means the attachment id itself
        // was unknown/expired server-side, or the request hard-failed. Either
        // way, closing silently would repeat the original bug, so say why.
        closeDrawer();
        showToast(data.error || "The attachment could not be used for this turn.");
      } else if (panels.length) {
        // Re-open on the delivered panel so the drawer shows the outcome, not
        // just the trace, and the card's key matches what is on screen.
        var cards = chatColumn.querySelectorAll(".result-card");
        var lastCard = cards[cards.length - 1];
        if (lastCard) openPanel(lastCard.getAttribute("data-panel-key"));
      }
    }

    var payload = MODES[currentMode].buildPayload(q, history, turnIds);
    if (runId) payload.run_id = runId;
    fetch(MODES[currentMode].endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (b) {
        throw new Error((b && b.detail) || ("Request failed (" + r.status + ")"));
      });
      return r.json();
    }).then(function (data) {
      deliver(data);
    }).catch(function (err) {
      deliver({ error: err.message || "Something went wrong." });
      showToast(err.message || "Request failed");
    }).finally(function () {
      busy = false;
      sendBtn.disabled = input.value.trim() === "";
      input.focus();
    });
  }

  /* ---------- composer ---------- */
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    sendBtn.disabled = busy || input.value.trim() === "";
    anchor.classList.toggle("has-text", input.value.trim() !== "");
  }
  // Attachments don't enable send on their own (a prompt is still required -
  // the model needs something to route on), but the state is re-derived after
  // any attachment change so `busy` and the button never drift apart.
  function refreshSendState() { autoGrow(); }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);

  /* ---------- attachments (composer +) ---------- */
  // Files are uploaded the moment they are picked, so the send turn carries only
  // ids. Whether an attachment gets processed is the model's decision on that
  // turn - this layer just stages the file and shows a chip.
  var attachRow = $("attachRow"), attachFile = $("attachFile"), attachBtn = $("attachBtn");
  var composerEl = $("composer");
  var pending = [];   // [{attachment_id, filename, size, uploading, localId}]
  var localSeq = 0;

  function attachmentIds() {
    return pending.filter(function (a) { return a.attachment_id; })
                  .map(function (a) { return a.attachment_id; });
  }

  function fmtSize(bytes) {
    if (!bytes) return "";
    return bytes < 1024 * 1024
      ? Math.max(1, Math.round(bytes / 1024)) + " KB"
      : (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function renderAttachRow() {
    attachRow.innerHTML = pending.map(function (a) {
      return '<div class="attach-chip' + (a.uploading ? " uploading" : "") + '" data-lid="' + a.localId + '">' +
        '<svg class="file-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' +
        '<span class="fn">' + esc(a.filename) + "</span>" +
        '<span class="sz">' + (a.uploading ? "uploading…" : esc(fmtSize(a.size))) + "</span>" +
        '<button class="x" aria-label="Remove attachment" data-lid="' + a.localId + '">×</button>' +
        "</div>";
    }).join("");
    Array.prototype.forEach.call(attachRow.querySelectorAll("button.x"), function (btn) {
      btn.addEventListener("click", function () {
        var lid = Number(btn.getAttribute("data-lid"));
        pending = pending.filter(function (a) { return a.localId !== lid; });
        renderAttachRow();
        refreshSendState();
      });
    });
  }

  function uploadAttachment(file) {
    if (!/^(image\/(jpeg|jpg|png)|application\/pdf)$/.test(file.type || "")) {
      showToast("Attach a JPEG, PNG or PDF.");
      return;
    }
    var entry = { localId: ++localSeq, filename: file.name, size: file.size, uploading: true, attachment_id: "" };
    pending.push(entry);
    renderAttachRow();
    refreshSendState();

    var form = new FormData();
    form.append("file", file, file.name);
    fetch("/api/attachments", { method: "POST", body: form })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
      .then(function (res) {
        if (res.status >= 400 || !res.body.ok) {
          pending = pending.filter(function (a) { return a.localId !== entry.localId; });
          showToast(res.body.detail || "Could not attach that file.");
        } else {
          entry.attachment_id = res.body.attachment_id;
          entry.size = res.body.size;
          entry.uploading = false;
        }
        renderAttachRow();
        refreshSendState();
      })
      .catch(function () {
        pending = pending.filter(function (a) { return a.localId !== entry.localId; });
        renderAttachRow();
        refreshSendState();
        showToast("Network error attaching the file.");
      });
  }

  attachBtn.addEventListener("click", function () { attachFile.click(); });
  attachFile.addEventListener("change", function () {
    Array.prototype.forEach.call(attachFile.files || [], uploadAttachment);
    attachFile.value = "";
  });
  // Dropping onto the composer works too, in MCP mode only (the mode that has
  // somewhere to send an attachment).
  ["dragenter", "dragover"].forEach(function (ev) {
    composerEl.addEventListener(ev, function (e) {
      if (currentMode !== "mcp") return;
      e.preventDefault(); composerEl.classList.add("drag-over");
    });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    composerEl.addEventListener(ev, function (e) { e.preventDefault(); composerEl.classList.remove("drag-over"); });
  });
  composerEl.addEventListener("drop", function (e) {
    if (currentMode !== "mcp") return;
    var files = (e.dataTransfer && e.dataTransfer.files) || [];
    Array.prototype.forEach.call(files, uploadAttachment);
  });

  /* ---------- result drawer (invoice runs) ---------- */
  // Renders exactly what the pipeline reports. Every figure shown comes from the
  // server's `computed` struct or a trace event's data - nothing is recomputed
  // here, which is the same rule the variance email follows.
  var drawerBody = $("drawerBody"), drawerTitle = $("drawerTitle");
  var tracePoll = null, seenSeq = -1, openPanelKey = "";
  // Panels keyed by the message they belong to, so reopening a card after more
  // turns (or after reloading a saved chat) shows that run, not the newest one.
  var panelStore = {};

  var STEP_TOOL_LABEL = {
    extract: "extract_invoice_fields",
    duplicate: "check_duplicate_invoice",
    fallback: "find_po_line (description fallback)",
    match: "match_supplier_invoice",
    propose: "propose_post_supplier_invoice",
    email: "send_variance_notification",
    review: "list_review_queue"
  };

  var OUTCOME_TEXT = {
    matched: ["good", "Clean 3-way match - invoice, PO and goods receipt agree. Nothing was " +
      "posted and no posting checks have run; continue below only if you want it in SAP."],
    proposed: ["good", "Pre-flight passed. A posting proposal is ready for your approval."],
    variance: ["warn", "Variance found. Nothing will be posted; a notification was prepared."],
    duplicate: ["warn", "Duplicate invoice. Stopped before any posting."],
    needs_review: ["warn", "Low confidence. Routed to the human review queue instead of guessing."],
    po_line_not_found: ["warn", "No PO line matched. Candidates surfaced for a human, not guessed."],
    ambiguous_po_line: ["warn", "Several PO lines could match. Surfaced for a human, not guessed."],
    po_not_found: ["warn", "That PO number doesn't exist on this tenant - likely a misread digit. Correct it below to retry."],
    extraction_failed: ["bad", "Could not read the invoice."],
    match_failed: ["bad", "Could not complete the match."],
    proposal_failed: ["bad", "Matched, but the posting payload could not be built."],
    blocked: ["warn", "The match stands, but SAP's pre-flight checks stopped the posting " +
      "before SAP was called. Nothing was sent - each reason below names who can fix it."],
    not_run: ["warn", "The assistant answered without running the invoice check on this " +
      "attachment - nothing was extracted or matched. Attach the file again and ask it to " +
      "check/match the invoice."]
  };

  function invCard(title, inner) {
    return '<div class="inv-card"><h3>' + title + "</h3>" + inner + "</div>";
  }
  function kv(k, v) {
    return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' +
      (v === "" || v === null || v === undefined ? "N/A" : esc(String(v))) + "</span></div>";
  }

  function renderTraceStep(e) {
    var tool = e.tool || STEP_TOOL_LABEL[e.step] || "";
    var glyph = e.status === "ok" ? "✓" : e.status === "warn" ? "!" : e.status === "error" ? "×" : "";
    var html = '<div class="trace-step">' +
      '<span class="trace-dot ' + esc(e.status) + '">' + glyph + "</span>" +
      '<div class="trace-body"><div class="trace-label">' + esc(e.label) + "</div>";
    if (tool) html += '<div class="trace-meta">step <code>' + esc(e.step) + "</code> · tool <code>" + esc(tool) + "</code></div>";
    var data = e.data || {};
    if (Object.keys(data).length) {
      html += '<div class="trace-data">' + esc(JSON.stringify(data, null, 1)) + "</div>";
    }
    return html + "</div></div>";
  }

  function appendTraceSteps(events, follow) {
    var host = $("traceList");
    if (!host) return;
    events.forEach(function (e) { host.insertAdjacentHTML("beforeend", renderTraceStep(e)); });
    // Follow the newest step only while the run is live. On a replay the user
    // wants to start at the top of the result, not at the last log line.
    if (follow) drawerBody.scrollTop = drawerBody.scrollHeight;
  }

  function renderExtracted(extracted) {
    if (!extracted) return "";
    var order = ["po_number", "po_item", "quantity", "unit_price", "currency",
                 "vendor_name", "vendor_invoice_number", "material_description"];
    var cells = order.filter(function (k) { return extracted[k]; }).map(function (k) {
      var f = extracted[k], c = Number(f.confidence);
      var cls = c >= 0.75 ? "hi" : "lo";
      return '<div class="kv"><span class="k">' + esc(k.replace(/_/g, " ")) + '</span><span class="v">' +
        (f.value ? esc(f.value) : "N/A") + '<span class="conf ' + cls + '">' + c.toFixed(2) + "</span></span></div>";
    }).join("");
    return invCard("Extracted fields", '<div class="kv-grid">' + cells + "</div>");
  }

  function renderComputed(match) {
    var c = (match && match.computed) || {};
    if (!Object.keys(c).length) return "";
    var body = '<div class="kv-grid">' +
      kv("PO", match.purchase_order) + kv("Item", c.po_item) + kv("Material", c.material) +
      kv("Ordered", c.ordered_qty + " " + (c.unit || "")) +
      kv("Received (net)", c.received_qty + " " + (c.unit || "")) +
      kv("Invoiced", c.invoiced_qty + " " + (c.unit || "")) +
      kv("PO unit price", c.po_unit_price + " " + (c.currency || "")) +
      kv("Invoice unit price", c.invoice_unit_price + " " + (c.currency || "")) +
      kv("Line amount", c.invoice_line_amount + " " + (c.currency || "")) +
      "</div>";
    if (match.match_method === "material-description-fallback") {
      body += '<div class="inv-warn-list"><div class="inv-warn">PO line resolved by material-description ' +
        "fallback, not a stated item number. Verify it is the right line.</div></div>";
    }
    return invCard("Server-computed figures (PO ↔ GR ↔ invoice)", body);
  }

  function renderVariances(match) {
    var vs = (match && match.variances) || [];
    if (!vs.length) return "";
    var rows = vs.map(function (v) {
      return '<div class="var-row"><span class="var-tag">' + esc(v.type) + "</span><span>" +
        esc(v.detail || "") + "</span></div>";
    }).join("");
    return invCard("Variances · fixed taxonomy, computed in Python", rows);
  }

  function renderCandidates(match) {
    var cs = (match && match.candidates) || [];
    if (!cs.length) return "";
    var rows = cs.map(function (c) {
      // The line's free text is what a human actually recognises a line by;
      // the material code alone ("EGM002") tells them nothing.
      var label = String(c.material || "");
      if (c.description) label += " · " + String(c.description);
      return '<div class="var-row"><span class="var-tag" style="background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent)">' +
        esc(String(c.item || "?")) + "</span><span>" + esc(label) +
        " · ordered " + esc(String(c.ordered || "")) + " " + esc(String(c.unit || "")) + "</span></div>";
    }).join("");
    return invCard("Candidate PO lines · pick one manually", rows);
  }

  // confidence_kind -> badge/control renderer. "ocr" carries a real percentage
  // (from the extractor); "po"/"system" are provenance badges, not a
  // fabricated score, since those values were never OCR-read in the first
  // place - "locked" fields (PO/PO item) render read-only: editing either
  // would silently detach the posting from the match that approved it.
  function fieldBadge(f) {
    if (f.confidence_kind === "ocr" && f.confidence_pct !== null && f.confidence_pct !== undefined) {
      var cls = Number(f.confidence_pct) >= 75 ? "hi" : "lo";
      return '<span class="conf ' + cls + '">' + Number(f.confidence_pct).toFixed(0) + "%</span>";
    }
    if (f.confidence_kind === "po") return '<span class="conf-badge po">From PO</span>';
    if (f.confidence_kind === "system") return '<span class="conf-badge sys">System default</span>';
    if (f.confidence_kind === "locked") return '<span class="conf-badge locked">Locked · from match</span>';
    return "";
  }

  function fieldRowHtml(f) {
    var control;
    if (f.editable) {
      var inputType = f.key.indexOf("date") !== -1 ? "date" : "text";
      control = '<input class="field-input" type="' + inputType + '" data-field-key="' +
        esc(f.key) + '" value="' + esc(f.value) + '">';
    } else {
      control = '<span class="field-value">' + (f.value ? esc(f.value) : "—") + "</span>";
    }
    return '<div class="field-row' + (f.editable ? "" : " field-row-locked") + '">' +
      '<div class="field-label">' + esc(f.label) + '<span class="field-tech">' + esc(f.sap_field) + "</span></div>" +
      '<div class="field-control">' + control + fieldBadge(f) + "</div>" +
      "</div>";
  }

  function renderFieldsForm(fields) {
    var header = fields.filter(function (f) { return f.section === "header"; });
    var items = fields.filter(function (f) { return f.section === "item"; });
    var html = '<div class="field-section"><h4>Header</h4>' + header.map(fieldRowHtml).join("") + "</div>";
    if (items.length) html += '<div class="field-section"><h4>Item</h4>' + items.map(fieldRowHtml).join("") + "</div>";
    return html;
  }

  // The inner markup of the proposal card, rebuilt wholesale both on first
  // render and after a successful edit (so #invProposalCard.innerHTML can be
  // swapped in place without re-rendering the whole outcome panel).
  function proposalCardInner(p) {
    var warns = (p.warnings || []).map(function (w) {
      return '<div class="inv-warn">' + esc(w) + "</div>";
    }).join("");
    var fieldsHtml = (p.fields && p.fields.length) ? renderFieldsForm(p.fields) :
      '<div class="inv-pre">' + esc(p.summary) + "</div>";
    return fieldsHtml +
      '<div class="inv-warn-list" id="proposalWarnings">' + warns + "</div>" +
      (p.fields && p.fields.length ?
        '<div class="field-form-actions">' +
          '<button class="apply-edits-btn" id="applyEditsBtn" data-pid="' + esc(p.proposal_id) + '">Apply edits</button>' +
          '<span class="apply-edits-note" id="applyEditsNote">Edit any non-locked field above, then apply before approving.</span>' +
        "</div>" : "") +
      '<div class="approve-row">' +
        '<button class="approve-btn" id="approveBtn" data-pid="' + esc(p.proposal_id) + '">Approve &amp; post to SAP</button>' +
        '<span class="approve-note" id="approveNote">Review the fields above - edit anything that doesn’t match, then ' +
        "approve. That click is the human approval; it is the only thing that writes to SAP.</span>" +
      "</div>";
  }

  function renderProposal(p) {
    if (!p) return "";
    if (!p.ok) {
      return invCard("Posting proposal", '<div class="inv-warn">' + esc(p.error || "Could not build a proposal.") +
        "</div>" + renderCandidates({ candidates: p.candidates || [] }));
    }
    return invCard("Posting proposal", '<div id="invProposalCard">' + proposalCardInner(p) + "</div>");
  }

  function renderEmail(em) {
    if (!em) return "";
    var body = '<div class="kv-grid">' + kv("Sent", em.sent ? "yes" : "no") +
      kv("Reason", em.reason || "") + (em.message_id ? kv("SES message id", em.message_id) : "") + "</div>";
    if (em.offending_numbers && em.offending_numbers.length) {
      body += '<div class="inv-warn-list"><div class="inv-warn">Numeral guard blocked the send. The drafted ' +
        "prose contained numbers absent from the verified facts: " + esc(em.offending_numbers.join(", ")) + "</div></div>";
    }
    if (em.body_preview) body += '<div class="inv-pre" style="margin-top:10px">' + esc(em.body_preview) + "</div>";
    return invCard("Variance email · numbers rendered server-side", body);
  }
