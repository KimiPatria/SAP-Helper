[pytest]
# `pythonpath = .` lets tests `import app.*` without installing the project.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers

# Layer 2 hits the real tenant. Deselected by default so `pytest` alone is
# always offline, deterministic and safe; run it explicitly with `-m live`.
markers =
    live: hits the real SAP tenant over the network (read-only, opt-in)
